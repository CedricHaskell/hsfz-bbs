name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      HSFZ_ENCRYPT_KEY: ci-test-only-key-at-least-32-characters
      HSFZ_DATA_DIR: ${{ runner.temp }}/hsfz-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
